{# Star rating. Use: {% include "campsites/_stars.html" with pct=90 rating="4.5" size="lg" %} #}
<span class="stars stars--{{ size|default:'md' }}" role="img" aria-label="Rated {{ rating }} out of 5">
  <span class="stars__row" aria-hidden="true">{% for i in "12345" %}<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.8.7-5.1 4.6 1.5 6.7L12 17.3l-6.1 3.4 1.5-6.7-5.1-4.6 6.8-.7z"/></svg>{% endfor %}</span>
  <span class="stars__row stars__row--fill" style="width: {{ pct }}%" aria-hidden="true">{% for i in "12345" %}<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.8.7-5.1 4.6 1.5 6.7L12 17.3l-6.1 3.4 1.5-6.7-5.1-4.6 6.8-.7z"/></svg>{% endfor %}</span>
</span>
