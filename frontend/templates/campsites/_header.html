{% comment %}
  Shared header for the campsite and camping van pages.
  Optional: pass search_url="camping_vans" search_label="Search camping vans" so the search bar searches RVs.
{% endcomment %}
<header class="site-header explorer-header">
  <div class="explorer-container explorer-header__inner">
    <a href="{% url 'home' %}" class="explorer-logo">WonderCamp</a>
 
    <form class="explorer-search" action="{% url search_url|default:'campsites:explorer' %}" method="get" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="7"/>
        <path d="M16 16l5 5"/>
      </svg>
      <input type="search" name="q" placeholder="Search" value="{{ request.GET.q|default:'' }}" aria-label="{{ search_label|default:'Search campsites' }}">
    </form>
 
    <nav class="explorer-icons" aria-label="Quick links">
      <a href="#" class="explorer-icon" aria-label="Map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/>
          <path d="M9 3v15M15 6v15"/>
        </svg>
      </a>
      <a href="{% if user.is_authenticated %}{% url 'notifications:list' %}{% else %}{% url 'login' %}{% endif %}" class="explorer-icon" aria-label="Notifications">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <mask id="wc-notif-mask">
            <rect width="64" height="64" fill="white"/>
            <circle cx="50" cy="14" r="16" fill="black"/>
          </mask>
          <rect x="6" y="10" width="46" height="46" rx="8" fill="currentColor" mask="url(#wc-notif-mask)"/>
          <circle cx="50" cy="14" r="10" fill="currentColor"/>
        </svg>
      </a>
      <a href="{% if user.is_authenticated %}{% url 'profile' %}{% else %}{% url 'login' %}{% endif %}" class="explorer-icon" aria-label="Account">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <clipPath id="wc-profile-clip">
            <circle cx="32" cy="32" r="27"/>
          </clipPath>
          <circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="4"/>
          <circle cx="32" cy="24" r="10" fill="currentColor"/>
          <path d="M12 60 V47 a6 6 0 0 1 6-6 h28 a6 6 0 0 1 6 6 V60 z" fill="currentColor" clip-path="url(#wc-profile-clip)"/>
        </svg>
      </a>
    </nav>
  </div>
</header>
