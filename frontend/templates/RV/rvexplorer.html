{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/rvexplorer.css' %}">

<div class="rv-page-container">

  <!-- Header Row -->
  <div class="rv-header-row">
    <a href="/" class="rv-brand-logo">WonderCamp</a>

    <div class="rv-search-box">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
      </svg>
      <input type="text" placeholder="Search">
    </div>

    <div class="rv-top-icons">
      <a href="/maps/" class="rv-icon-btn" title="Map">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-6-3V4l6 3m0 13l6-3m-6 3V7m6 13l6-3V4l-6 3m0 13V7m0 0L9 4" />
        </svg>
      </a>
      <a href="/saved/" class="rv-icon-btn" title="Saved">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" viewBox="0 0 24 24">
          <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2v16z"/>
        </svg>
      </a>
      <a href="/account/" class="rv-icon-btn" title="Account">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
        </svg>
      </a>
    </div>
  </div>

  <!-- Category Links -->
  <div class="rv-subnav">
    <a href="/campsites/" class="rv-subnav-link">Campsites</a>
    <a href="{% url 'camping_vans' %}" class="rv-subnav-link active">RV</a>
    <a href="/lodging/" class="rv-subnav-link">Lodging</a>
  </div>

  <!-- Cards Grid -->
  <div class="rv-cards-grid">
    
    <!-- Card 1 -->
    <a href="{% url 'rv_details_id' 1 %}" class="rv-card">
      <div class="rv-capsule-frame">
        <img src="{% static 'images/image 1.png' %}" alt="Class A Motorhomes RV" onerror="this.src='https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?w=600'">
      </div>
      <h3 class="rv-card-title">Class A Motorhomes RV</h3>
      <p class="rv-card-tag">High luxury RV</p>
    </a>

    <!-- Card 2 -->
    <a href="{% url 'rv_details_id' 2 %}" class="rv-card">
      <div class="rv-capsule-frame">
        <img src="{% static 'images/image 2.png' %}" alt="Class B Motorhomes RV" onerror="this.src='https://images.unsplash.com/photo-1565043666747-69f6646db940?w=600'">
      </div>
      <h3 class="rv-card-title">Class B Motorhomes RV</h3>
      <p class="rv-card-tag">Medium luxury RV</p>
    </a>

    <!-- Card 3 -->
    <a href="{% url 'rv_details_id' 3 %}" class="rv-card">
      <div class="rv-capsule-frame">
        <img src="{% static 'images/image 3.png' %}" alt="Class C Motorhomes RV" onerror="this.src='https://images.unsplash.com/photo-1510312305653-8ed496efae75?w=600'">
      </div>
      <h3 class="rv-card-title">Class C Motorhomes RV</h3>
      <p class="rv-card-tag">Medium luxury RV</p>
    </a>

  </div>

</div>
{% endblock %}
